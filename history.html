<section id="page-history" class="page-section space-y-4 hidden">
  <div class="flex justify-between items-center px-1">
    <h2 class="text-xl font-bold" style="color: var(--text-main);">History Log</h2>
    <select id="historyTagFilter" onchange="window.renderHistory('fullHistoryList')" class="bg-transparent text-xs font-bold outline-none cursor-pointer" style="color: var(--accent);">
      <option value="all">All Tags</option>
    </select>
  </div>
  <div class="flex flex-col gap-2 px-1">
    <div class="relative">
      <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--text-muted);"></i>
      <input type="text" id="historySearch" oninput="window.toggleHistoryClearBtn()" placeholder="Search logs by trigger, tag..." class="w-full pl-9 pr-3 py-2 rounded-xl border text-xs font-semibold outline-none" style="background-color: var(--input-bg); color: var(--text-main); border-color: var(--card-border);">
    </div>
    <div class="flex gap-2">
      <div class="flex-1 flex items-center gap-1.5">
        <span class="text-[10px] font-bold uppercase shrink-0" style="color: var(--text-muted);">From</span>
        <input type="date" id="historyDateFrom" onchange="window.toggleHistoryClearBtn()" class="flex-1 px-2 py-1.5 rounded-xl border text-[11px] font-semibold outline-none" style="background-color: var(--input-bg); color: var(--text-main); border-color: var(--card-border);">
      </div>
      <div class="flex-1 flex items-center gap-1.5">
        <span class="text-[10px] font-bold uppercase shrink-0" style="color: var(--text-muted);">To</span>
        <input type="date" id="historyDateTo" onchange="window.toggleHistoryClearBtn()" class="flex-1 px-2 py-1.5 rounded-xl border text-[11px] font-semibold outline-none" style="background-color: var(--input-bg); color: var(--text-main); border-color: var(--card-border);">
      </div>
      <button id="historyClearFilters" onclick="window.clearHistoryFilters()" class="hidden px-2.5 py-1.5 rounded-xl border text-[11px] font-bold active:scale-95 transition-all shrink-0" style="background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); color: #EF4444;"><i data-lucide="x" class="w-3 h-3"></i></button>
    </div>
  </div>
  <div id="fullHistoryList" class="space-y-4"></div>
  <div id="historyLoadMore" class="text-center hidden pt-2">
      <button onclick="window.loadMoreHistory()" class="px-4 py-2 rounded-full border text-xs font-bold active:scale-95 transition-all" style="background: var(--input-bg); border-color: var(--card-border); color: var(--text-main);">Load More</button>
  </div>
</section>

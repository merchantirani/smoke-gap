<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5EFF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E5EFF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1024" height="500" fill="url(#grid)"/>

  <!-- Left side - App icon representation -->
  <g transform="translate(80, 100)">
    <!-- App icon background -->
    <rect x="0" y="0" width="180" height="180" rx="40" fill="#111827" stroke="url(#accentGrad)" stroke-width="2"/>

    <!-- Pause ring -->
    <circle cx="90" cy="90" r="65" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="340 60" transform="rotate(-30, 90, 90)" filter="url(#softGlow)"/>

    <!-- Inner glow -->
    <circle cx="90" cy="90" r="50" fill="rgba(30, 94, 255, 0.1)"/>

    <!-- App name -->
    <text x="90" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">pause</text>
  </g>

  <!-- Right side - Text content -->
  <g transform="translate(320, 80)">
    <!-- Main heading -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">
      Quit Smoking
    </text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#accentGrad)">
      Track Progress
    </text>

    <!-- Subheading -->
    <text x="0" y="170" font-family="Arial, sans-serif" font-size="22" fill="#9CA3AF">
      Premium habit tracker with analytics
    </text>

    <!-- Features -->
    <g transform="translate(0, 200)">
      <circle cx="8" cy="8" r="6" fill="#10B981"/>
      <text x="24" y="14" font-family="Arial, sans-serif" font-size="16" fill="#D1D5DB">Track cigarettes &amp; cravings</text>

      <circle cx="8" cy="48" r="6" fill="#F59E0B"/>
      <text x="24" y="54" font-family="Arial, sans-serif" font-size="16" fill="#D1D5DB">Beautiful charts &amp; insights</text>

      <circle cx="8" cy="88" r="6" fill="#EF4444"/>
      <text x="24" y="94" font-family="Arial, sans-serif" font-size="16" fill="#D1D5DB">Save money &amp; health</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="490" width="1024" height="10" fill="url(#accentGrad)"/>

  <!-- Decorative elements -->
  <circle cx="900" cy="100" r="80" fill="rgba(30, 94, 255, 0.1)" filter="url(#glow)"/>
  <circle cx="950" cy="400" r="60" fill="rgba(245, 158, 11, 0.08)" filter="url(#glow)"/>
</svg>
 <!-- Yahan humari saari alag files khud load hongi -->
  <div id="app-container"></div>
  <div id="modals-container"></div>

  <!-- 1. JS Files Yahan Aayengi (</body> se theek pehle) -->
  <script src="state.js"></script>
  <script src="tracker.js"></script>
  <script src="modals.js"></script>
  <script src="charts.js"></script>
  <script src="history.js"></script>

  <!-- 2. App load karne wala function -->
  <script>
    async function loadAppFiles() {
      try {
        const pages = ['tracker.html', 'insights.html', 'history.html', 'settings.html'];
        let pagesHtml = '';
        
        for (let page of pages) {
          let response = await fetch(page);
          pagesHtml += await response.text();
        }
        document.getElementById('app-container').innerHTML = pagesHtml;

        let modalsResponse = await fetch('modals.html');
        document.getElementById('modals-container').innerHTML = await modalsResponse.text();

        // 3. Jab saari HTML theek se load ho jaye, tab app ko start karein
        setTimeout(() => {
          if (window.lucide) lucide.createIcons(); // Icons load karega
          if (window.bootApp) window.bootApp();    // App ke logic ko start karega
        }, 150);

      } catch (error) {
        console.error("Files load hone mein error:", error);
      }
    }
    
    loadAppFiles();
  </script>

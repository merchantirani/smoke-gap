<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="25%" stop-color="#FFA500"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="75%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- 3D Highlight Gradient -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Inner Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="96" fill="#0F0F0F"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFA500" stroke-width="40" opacity="0.1" filter="url(#glow)"/>

  <!-- Main Ring with Gap (gap = 45 degrees at top) -->
  <!-- Ring starts at 45° and ends at 315° (270° arc with 90° gap at top) -->
  <path
    d="M 256 76
       A 180 180 0 1 1 128.79 128.79"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="36"
    stroke-linecap="round"
    filter="url(#shadow)"
    transform="rotate(0, 256, 256)"
  />

  <!-- 3D Highlight Overlay -->
  <path
    d="M 256 76
       A 180 180 0 1 1 128.79 128.79"
    fill="none"
    stroke="url(#highlight)"
    stroke-width="36"
    stroke-linecap="round"
    transform="rotate(0, 256, 256)"
  />

  <!-- Inner Edge Highlight -->
  <path
    d="M 256 94
       A 162 162 0 1 1 141.43 141.43"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.3"
    transform="rotate(0, 256, 256)"
  />

  <!-- Outer Edge Shadow -->
  <path
    d="M 256 58
       A 198 198 0 1 1 116.15 116.15"
    fill="none"
    stroke="#000000"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.5"
    transform="rotate(0, 256, 256)"
  />

  <!-- Premium Specular Highlight -->
  <ellipse cx="180" cy="140" rx="60" ry="20" fill="#FFFFFF" opacity="0.15" transform="rotate(-30, 180, 140)"/>
</svg>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW Debug - pause</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 1rem;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #10b981; }
    .status {
      background: #2d2d2d;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid #10b981;
    }
    .status.error { border-left-color: #ef4444; }
    .status.warning { border-left-color: #f59e0b; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .label { color: #9ca3af; font-size: 0.9rem; }
    .value { color: #fff; font-weight: bold; }
    button {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 0.25rem;
    }
    button:hover { background: #059669; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    .log {
      background: #111;
      padding: 1rem;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      margin-top: 1rem;
    }
    .log-entry { margin: 0.25rem 0; padding: 0.25rem; }
    .log-entry.success { color: #10b981; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #3b82f6; }
    .cache-list {
      background: #2d2d2d;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .cache-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #404040;
    }
  </style>
</head>
<body>
  <h1>🔧 Service Worker Debug</h1>

  <div class="status" id="swStatus">
    <h2>Service Worker Status</h2>
    <p><span class="label">Status:</span> <span class="value" id="swState">Checking...</span></p>
    <p><span class="label">Controller:</span> <span class="value" id="swController">Checking...</span></p>
    <p><span class="label">Scope:</span> <span class="value" id="swScope">Checking...</span></p>
  </div>

  <div class="status" id="cacheStatus">
    <h2>Cache Status</h2>
    <p><span class="label">Cache Version:</span> <span class="value" id="cacheVersion">Checking...</span></p>
    <p><span class="label">Caches Found:</span> <span class="value" id="cacheCount">Checking...</span></p>
  </div>

  <div class="status" id="connectionStatus">
    <h2>Connection</h2>
    <p><span class="label">Online:</span> <span class="value" id="isOnline">Checking...</span></p>
    <p><span class="label">URL:</span> <span class="value" id="currentUrl">Checking...</span></p>
  </div>

  <button onclick="checkSW()">🔍 Check Service Worker</button>
  <button onclick="cacheApp()">📦 Cache App Now</button>
  <button onclick="clearCaches()">🗑️ Clear All Caches</button>
  <button onclick="unregisterSW()" class="danger">❌ Unregister SW</button>

  <div class="cache-list" id="cacheList">
    <h2>Cached Files</h2>
    <div id="cachedFiles">Loading...</div>
  </div>

  <div class="log" id="debugLog">
    <h2 style="margin-bottom: 0.5rem;">Debug Log</h2>
    <div id="logEntries"></div>
  </div>

  <script>
    function log(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      document.getElementById('logEntries').prepend(entry);
      console.log(msg);
    }

    function updateUI() {
      document.getElementById('currentUrl').textContent = window.location.href;
      document.getElementById('isOnline').textContent = navigator.onLine ? '✅ Yes' : '❌ No';
      document.getElementById('isOnline').style.color = navigator.onLine ? '#10b981' : '#ef4444';
    }

    async function checkSW() {
      log('Checking service worker status...');

      if (!navigator.serviceWorker) {
        log('❌ Service Worker not supported!', 'error');
        document.getElementById('swState').textContent = '❌ Not Supported';
        document.getElementById('swStatus').className = 'status error';
        return;
      }

      document.getElementById('swState').textContent = '⏳ Checking...';

      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        log(`Found ${registrations.length} registration(s)`);

        if (registrations.length === 0) {
          document.getElementById('swState').textContent = '❌ No Registration';
          document.getElementById('swStatus').className = 'status warning';
          log('⚠️ No service worker registered', 'error');
          return;
        }

        const reg = registrations[0];
        const sw = reg.installing || reg.waiting || reg.active;

        if (!sw) {
          document.getElementById('swState').textContent = '❌ No Worker';
          document.getElementById('swStatus').className = 'status error';
          log('❌ No service worker found', 'error');
          return;
        }

        log(`Service Worker state: ${sw.state}`);
        document.getElementById('swState').textContent = `✅ ${sw.state}`;
        document.getElementById('swController').textContent = navigator.serviceWorker.controller ? '✅ Active' : '❌ None';
        document.getElementById('swScope').textContent = reg.scope;

        document.getElementById('swStatus').className = 'status';

        // Check caches
        const cacheNames = await caches.keys();
        document.getElementById('cacheVersion').textContent = cacheNames.join(', ') || '❌ No Caches';
        document.getElementById('cacheCount').textContent = cacheNames.length;
        document.getElementById('cacheStatus').className = cacheNames.length > 0 ? 'status' : 'status warning';

        log(`Found ${cacheNames.length} cache(s)`);

        // List cached files
        if (cacheNames.length > 0) {
          const cache = await caches.open(cacheNames[0]);
          const keys = await cache.keys();
          log(`Cache contains ${keys.length} files`);

          const filesDiv = document.getElementById('cachedFiles');
          filesDiv.innerHTML = keys.map(req =>
            `<div class="cache-item"><span>${req.url}</span></div>`
          ).join('');
        }

      } catch (err) {
        log(`❌ Error: ${err.message}`, 'error');
        document.getElementById('swState').textContent = '❌ Error';
        document.getElementById('swStatus').className = 'status error';
      }
    }

    async function cacheApp() {
      log('Starting cache process...');

      if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
        log('❌ No active service worker', 'error');
        return;
      }

      try {
        // Send message to SW to cache files
        navigator.serviceWorker.controller.postMessage({ type: 'GET_CACHE_STATUS' });
        log('✅ Cache request sent', 'success');

        // Wait a moment and check again
        setTimeout(checkSW, 2000);
      } catch (err) {
        log(`❌ Cache error: ${err.message}`, 'error');
      }
    }

    async function clearCaches() {
      log('Clearing all caches...');

      try {
        const cacheNames = await caches.keys();
        for (const name of cacheNames) {
          await caches.delete(name);
          log(`Deleted cache: ${name}`);
        }

        log('✅ All caches cleared', 'success');
        setTimeout(checkSW, 1000);
      } catch (err) {
        log(`❌ Clear error: ${err.message}`, 'error');
      }
    }

    async function unregisterSW() {
      log('Unregistering service worker...');

      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
          log(`Unregistered: ${reg.scope}`);
        }

        log('✅ Service worker unregistered', 'success');
        setTimeout(checkSW, 1000);
      } catch (err) {
        log(`❌ Unregister error: ${err.message}`, 'error');
      }
    }

    // Listen for messages from service worker
    navigator.serviceWorker.addEventListener('message', (e) => {
      log(`Message from SW: ${JSON.stringify(e.data)}`);
    });

    // Online/offline events
    window.addEventListener('online', () => {
      log('🌐 Back online', 'success');
      updateUI();
    });

    window.addEventListener('offline', () => {
      log('📡 Gone offline', 'info');
      updateUI();
    });

    // Initial check
    updateUI();
    checkSW();
  </script>
</body>
</html>
